<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="MyNet — your conference workspace: what is happening next, who to meet, and where your conversations live."
    />
    <!-- The document title is set from the single branding constant at runtime (FR-049).
         This value is the pre-hydration fallback only. -->
    <title>MyNet</title>

    <!--
      T025 (010) — the browser-chrome icons (FR-813, FR-816).

      This document carried NEITHER a favicon link nor an apple-touch-icon until now, so every
      tab showing MyNet displayed the browser's default blank-document glyph. These three links
      are created by feature 010, not modified by it.

      `/favicon.ico` is deliberately absent from this list. It exists at the origin root for the
      clients that guess that path without parsing the document — feed readers, link unfurlers,
      crawlers — and every current browser prefers the links below and never asks for it
      (research R9). Adding a link to it would only make browsers download a second copy.

      The files are derived from the brand board, not hand-exported:
      `node scripts/generate-brand-assets.mjs`. A declared icon with no file fails
      `apps/web/tests/unit/icon-declarations.test.ts`.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
